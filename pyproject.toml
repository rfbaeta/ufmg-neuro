[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro"
version = "0.1.0"
description = "IntelliCage activity analysis and dominance ranking"
requires-python = ">=3.8,<3.9"

dependencies = [
    # Core scientific stack
    "numpy==1.22.0",
    "pandas==1.5.2",
    "scipy==1.10.0",
    "scikit-learn==1.2.0",
    "scikit-optimize==0.9.0",
    "statsmodels==0.14.1",
    "patsy==1.0.2",

    # Plotting
    "matplotlib==3.6.2",
    "plotly==6.6.0",
    "seaborn==0.13.0",
    "Pillow==9.4.0",
    "kiwisolver==1.4.7",
    "contourpy==1.1.1",
    "cycler==0.12.1",
    "fonttools==4.57.0",

    # Domain-specific
    "circadipy==0.1.11",
    "CosinorPy==3.0",
    "PyMICE==1.1.0",

    # Jupyter
    "ipykernel==6.29.4",
    "ipython==8.12.3",
    "jupyterlab==4.1.8",
    "notebook==7.1.3",
    "nbformat==5.10.4",
    "nbconvert==7.16.6",
    "nbclient==0.10.1",

    # Data / IO
    "openpyxl==3.0.10",
    "PyYAML==6.0.3",
    "pyaml==26.2.1",
    "requests==2.32.4",

    # Utilities
    "python-dateutil==2.9.0.post0",
    "pytz==2026.1.post1",
    "six==1.17.0",
    "packaging==26.0",
    "typing_extensions==4.13.2",
    "backports.zoneinfo==0.2.1",
    "importlib_metadata==8.5.0",
    "importlib_resources==6.4.5",
    "joblib==1.4.2",
    "threadpoolctl==3.5.0",
    "psutil==7.2.2",

    # Qt backend (for matplotlib qt mode)
    "PyQt5==5.15.10",
    "PyQt5-Qt5==5.15.18",
    "PyQt5_sip==12.15.0",
]

[project.optional-dependencies]
dev = [
    "Sphinx==7.1.2",
    "nbsphinx==0.9.3",
    "sphinx-rtd-theme==2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
